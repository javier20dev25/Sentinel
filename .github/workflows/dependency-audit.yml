name: Dependency Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  audit:
    name: "Node.js Dependency Audit"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          echo "## 📦 Dependency Audit" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate --json > /tmp/audit.json || true
          CRITICAL=$(cat /tmp/audit.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat /tmp/audit.json | jq '.metadata.vulnerabilities.high // 0')
          MODERATE=$(cat /tmp/audit.json | jq '.metadata.vulnerabilities.moderate // 0')
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT

      - name: Comment Audit Results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🔒 Sentinel Dependency Security Audit\n\n';
            const parseAudit = (file) => {
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                const v = data.metadata?.vulnerabilities || {};
                return { critical: v.critical||0, high: v.high||0, moderate: v.moderate||0, low: v.low||0 };
              } catch { return null; }
            };
            const root = parseAudit('/tmp/audit.json');
            const fmt = (v) => v
              ? `| 🔴 Critical | ${v.critical} |\n| 🟠 High | ${v.high} |\n| 🟡 Moderate | ${v.moderate} |\n| 🔵 Low | ${v.low} |`
              : '| N/A | — |';
            body += `| Severity | Count |\n|:---|:---|\n${fmt(root)}\n\n`;
            const hasIssues = (root?.critical > 0 || root?.high > 0);
            body += hasIssues
              ? '> ⚠️ **Action Required:** Critical or High vulnerabilities detected. Run `npm audit fix`.'
              : '> ✅ No Critical or High severity vulnerabilities detected.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail on Critical Vulnerabilities
        run: |
          CRIT=${{ steps.audit.outputs.critical || 0 }}
          if [ "$CRIT" -gt 0 ]; then
            echo "❌ BLOCKING BUILD: Critical vulnerabilities detected."
            exit 1
          fi
          echo "✅ No critical vulnerabilities. Build allowed."
