name: Sentinel Self-Security Scan

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  security-scan:
    name: "Sentinel Static analysis"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Run Sentinel Scan
        run: node packages/sentinel-cli/cli/index.js scan || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
