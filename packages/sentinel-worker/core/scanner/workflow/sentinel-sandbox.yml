##
## Sentinel CI Sandbox — Workflow Template (Modo Pasivo)
##
## INSTRUCCIONES DE USO:
##   1. Copia este archivo a `.github/workflows/sentinel-sandbox.yml`
##      en cada repositorio que quieras proteger con el sandbox dinámico.
##   2. Protege la rama principal: Settings > Branches > Branch protection rules
##      → Requerir PR + "Require review from Code Owners".
##   3. Asegúrate de que NADIE pueda modificar este archivo sin un PR aprobado.
##
## QUÉ HACE ESTE WORKFLOW:
##   1. Se activa manualmente (workflow_dispatch) o vía repository_dispatch
##      (que puede disparar Sentinel CLI con la API de GitHub).
##   2. Usa Harden-Runner para auditoria de egress (conexiones salientes).
##      En repos privados sin licencia, desactiva harden-runner y usa netstat.
##   3. Ejecuta npm ci con --ignore-scripts para baseline (sin código malicioso).
##   4. Captura: diff del lockfile, archivos .wasm creados, conexiones abiertas,
##      y variables de entorno npm.
##   5. Sube todo como artefacto "sentinel-telemetry" que Sentinel CLI descarga
##      y analiza para detectar comportamientos anómalos.
##
## TELEMETRÍA CAPTURADA:
##   - /tmp/lockfile-diff.txt    → Cambios en package-lock.json post-install
##   - /tmp/wasm-files.txt       → Archivos .wasm creados en node_modules
##   - /tmp/npm-env.txt          → Variables de entorno relacionadas con npm
##   - /tmp/netstat-before.txt   → Conexiones de red antes de npm install
##   - /tmp/netstat-after.txt    → Conexiones de red después de npm install
##   - /tmp/new-files.txt        → Archivos binarios nuevos creados (find node_modules -type f)
##
## VERSIÓN: Sentinel 3.0 — Sandbox Pasivo
##

name: "🛡️ Sentinel Sandbox Analysis"

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Rama a analizar"
        required: false
        default: ""
        type: string
      debug_mode:
        description: "Activar logging detallado"
        required: false
        default: false
        type: boolean
      sentinel_signature:
        description: "Firma JWT temporal de validación"
        required: true
        type: string

  repository_dispatch:
    types: [sentinel-sandbox-run]

# Permisos necesarios para reportar en el PR and leer el código
permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  sentinel-sandbox:
    name: "Sentinel Dynamic Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "🔐 Validar Firma y Entorno"
        run: |
          if [ -z "${{ inputs.sentinel_signature }}" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Firma SENTINEL_SIGNATURE requerida para ejecución."
            exit 1
          fi
          echo "SENTINEL_SIGNATURE=${{ inputs.sentinel_signature }}" >> $GITHUB_ENV

      - name: "🔒 Habilitar monitoreo de red (Harden-Runner)"
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            registry.npmjs.org:443
            registry.yarnpkg.com:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443

      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "🧬 Setup Sentinel X-Ray Toolkit & Camuflaje Avanzado"
        run: |
          # 1. Camuflaje Anti-Huella (Virtualización de entorno)
          echo "GITHUB_ACTIONS=false" >> $GITHUB_ENV
          echo "CI=false" >> $GITHUB_ENV
          echo "USER=developer" >> $GITHUB_ENV
          # HoneyToken Señuelo
          echo "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE" >> $GITHUB_ENV

          # 2. Profile Locale Spoofing based on SENTINEL_SANDBOX_PROFILE
          PROFILE="${SENTINEL_SANDBOX_PROFILE:-evasion-detect}"
          if [ "$PROFILE" = "aggressive" ] || [ "$PROFILE" = "evasion-detect" ]; then
            echo "TZ=Europe/Moscow" >> $GITHUB_ENV
            echo "LANG=ru_RU.UTF-8" >> $GITHUB_ENV
            echo "LC_ALL=ru_RU.UTF-8" >> $GITHUB_ENV
            echo "[SENTINEL] Active Profile: $PROFILE (Spoofing TZ/LANG to RU)"
          else
            echo "TZ=UTC" >> $GITHUB_ENV
            echo "[SENTINEL] Active Profile: Safe (No spoofing)"
          fi

          # 3. Inject X-Ray Hooking Engine (Deep Userland Inspection)
          cat << 'EOF' > /tmp/sentinel-xray.js
          const fs = require('fs');
          function logAlert(msg) {
              fs.appendFileSync('/tmp/xray-alerts.txt', `[SENTINEL-XRAY] 🚨 ${msg}\n`);
          }

          // Hook: eval & new Function
          const originalEval = global.eval;
          global.eval = function (code) { logAlert('INTERCEPTED EVAL PAYLOAD'); return originalEval(code); };
          const originalFunction = global.Function;
          global.Function = new Proxy(originalFunction, {
              construct(target, args) { logAlert('INTERCEPTED new Function'); return new target(...args); }
          });

          // Hook: child_process
          try {
              const cp = require('child_process');
              const origSpawn = cp.spawn;
              const origExec = cp.exec;
              const origExecSync = cp.execSync;
              cp.spawn = function() { logAlert(`NATIVE PROCESS SPAWN: ${arguments[0]}`); return origSpawn.apply(this, arguments); };
              cp.exec = function() { logAlert(`NATIVE PROCESS EXEC: ${arguments[0]}`); return origExec.apply(this, arguments); };
              cp.execSync = function() { logAlert(`NATIVE PROCESS EXECSYNC: ${arguments[0]}`); return origExecSync.apply(this, arguments); };
          } catch(e) {}

          // Hook: process.binding (Advanced Evasion)
          try {
              const origBinding = process.binding;
              process.binding = function(name) {
                  logAlert(`SENSITIVE PROCESS BINDING: ${name}`);
                  return origBinding.apply(this, arguments);
              };
          } catch(e) {}

          // Hook: Module Load (Dependency Hijacking)
          try {
              const Module = require('module');
              const origLoad = Module._load;
              Module._load = function(request) {
                  if (request.includes('../') || request.startsWith('/')) {
                      logAlert(`SUSPICIOUS MODULE LOAD: ${request}`);
                  }
                  return origLoad.apply(this, arguments);
              };
          } catch(e) {}

          // Hook: WebAssembly
          try {
              const origInstantiate = WebAssembly.instantiate;
              WebAssembly.instantiate = function() { logAlert('WASM BINARY INSTANTIATION ATTEMPT'); return origInstantiate.apply(this, arguments); };
          } catch(e) {}

          // Hook: vm module
          try {
              const vm = require('vm');
              const origRunInNewContext = vm.runInNewContext;
              vm.runInNewContext = function() { logAlert('VM NEW CONTEXT EXECUTION'); return origRunInNewContext.apply(this, arguments); };
          } catch(e) {}
          EOF
          
          # Export to node process
          echo "NODE_OPTIONS=--require /tmp/sentinel-xray.js" >> $GITHUB_ENV

      - name: "📸 Snapshot pre-instalación"
        run: |
          echo "=== SENTINEL PRE-INSTALL SNAPSHOT ===" > /tmp/sentinel-pre.txt
          cp package-lock.json /tmp/before-lock.json 2>/dev/null || echo "{}" > /tmp/before-lock.json
          ss -tunp 2>/dev/null > /tmp/netstat-before.txt || echo "netstat not available" > /tmp/netstat-before.txt

      - name: "📦 Dynamic Installation (Detonation Mode con strace)"
        run: |
          sudo apt-get update && sudo apt-get install -y strace
          echo "Ejecutando detonación en Sandbox..."
          strace -f -e trace=execve,connect,openat -o /tmp/syscalls.txt npm install --no-audit | tee /tmp/npm-install-output.txt || true
        env:
          NO_COLOR: "1"

      - name: "🔍 Análisis post-instalación"
        run: |
          diff /tmp/before-lock.json package-lock.json > /tmp/lockfile-diff.txt 2>/dev/null || echo "No diff" > /tmp/lockfile-diff.txt
          ss -tunp 2>/dev/null > /tmp/netstat-after.txt || echo "netstat not available" > /tmp/netstat-after.txt
          find node_modules -name "*.wasm" -type f 2>/dev/null > /tmp/wasm-files.txt || echo "No WASM" > /tmp/wasm-files.txt
          find node_modules -type f -executable -not -name "*.sh" 2>/dev/null | head -50 > /tmp/executables.txt || echo "No Execs" > /tmp/executables.txt

      - name: "📤 Subir telemetría Sentinel"
        uses: actions/upload-artifact@v4
        with:
          name: "sentinel-telemetry"
          path: |
            /tmp/lockfile-diff.txt
            /tmp/wasm-files.txt
            /tmp/netstat-after.txt
            /tmp/npm-install-output.txt
            /tmp/executables.txt
            /tmp/syscalls.txt
            /tmp/xray-alerts.txt
          retention-days: 7

      - name: "📊 Resumen de análisis"
        if: always()
        run: |
          echo "## 🛡️ Sentinel Sandbox Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| WASM Files | $(grep -v 'No WASM' /tmp/wasm-files.txt | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Executables | $(grep -v 'No Execs' /tmp/executables.txt | wc -l) |" >> $GITHUB_STEP_SUMMARY
